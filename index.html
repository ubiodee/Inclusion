<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclusion – Speech to Sign</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 0.5rem; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 1.5rem; }
    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 1rem 0;
      justify-content: center;
    }
    input, button {
      padding: 0.65rem 1rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }
    input { flex: 1; min-width: 200px; background: #1e293b; color: #e2e8f0; }
    button { background: #22c55e; color: white; cursor: pointer; font-weight: 600; }
    button.secondary { background: #3b82f6; }
    #avatar-container {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
    }
    agent-3d {
      border-radius: 12px;
      overflow: hidden;
      background: #1e293b;
    }
  </style>
</head>
<body>
  <h1>Inclusion</h1>
  <p class="subtitle">Speak or type — the avatar will sign it</p>

  <div class="controls">
    <button id="listenBtn">🎤 Speak</button>
    <input id="textInput" type="text" placeholder="Type text here..." />
    <button id="signBtn" class="secondary">Sign</button>
  </div>

  <div id="avatar-container">
    <agent-3d
      body="https://three.ws/avatars/default.glb"
      sign-language
      style="width: 420px; height: 520px; display: block;">
    </agent-3d>
  </div>

  <script src="https://three.ws/embed.js"></script>

  <script>
    const textInput = document.getElementById("textInput");
    const listenBtn = document.getElementById("listenBtn");
    const signBtn = document.getElementById("signBtn");
    const avatar = document.querySelector("agent-3d");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        textInput.value = text;
        signText(text);
      };

      recognition.onerror = (e) => console.error("Speech error:", e.error);
    } else {
      listenBtn.disabled = true;
      listenBtn.textContent = "Speech not supported";
    }

    listenBtn.onclick = () => {
      if (recognition) recognition.start();
    };

    signBtn.onclick = () => signText(textInput.value);

    textInput.onkeydown = (e) => {
      if (e.key === "Enter") signText(textInput.value);
    };

    function signText(text) {
      if (!text || !text.trim()) return;

      if (avatar && typeof avatar.sign === "function") {
        avatar.sign(text);
      } else if (avatar) {
        avatar.setAttribute("sign-text", text);
        avatar.dispatchEvent(new CustomEvent("sign", { detail: text }));
      }
    }
  </script>
</body>
</html>
